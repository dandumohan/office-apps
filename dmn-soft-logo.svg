<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 254 68" width="254" height="68" role="img" aria-label="DMN SOFT">
<title>DMN SOFT</title>
<style>.dmn-orbit,.dmn-petals{transform-box:view-box;transform-origin:32px 32px}
.dmn-orbit{animation:dmn-orbit 18s linear infinite}
.dmn-petals{animation:dmn-bloom 9s ease-in-out infinite}
.dmn-dot{animation:dmn-pulse 2.4s ease-in-out infinite}
@keyframes dmn-orbit{to{transform:rotate(360deg)}}
@keyframes dmn-bloom{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.06) rotate(6deg)}}
@keyframes dmn-pulse{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dmn-orbit,.dmn-petals,.dmn-dot{animation:none}}</style>
<g><g class="dmn-orbit"><circle class="dmn-dot" cx="32.00" cy="5.80" r="2.3" fill="#e8590c" style="animation-delay:-0.00s"/><circle class="dmn-dot" cx="47.40" cy="10.80" r="1.6" fill="#e8590c" style="animation-delay:-0.24s"/><circle class="dmn-dot" cx="56.92" cy="23.90" r="2.3" fill="#e8590c" style="animation-delay:-0.48s"/><circle class="dmn-dot" cx="56.92" cy="40.10" r="1.6" fill="#e8590c" style="animation-delay:-0.72s"/><circle class="dmn-dot" cx="47.40" cy="53.20" r="2.3" fill="#e8590c" style="animation-delay:-0.96s"/><circle class="dmn-dot" cx="32.00" cy="58.20" r="1.6" fill="#e8590c" style="animation-delay:-1.20s"/><circle class="dmn-dot" cx="16.60" cy="53.20" r="2.3" fill="#e8590c" style="animation-delay:-1.44s"/><circle class="dmn-dot" cx="7.08" cy="40.10" r="1.6" fill="#e8590c" style="animation-delay:-1.68s"/><circle class="dmn-dot" cx="7.08" cy="23.90" r="2.3" fill="#e8590c" style="animation-delay:-1.92s"/><circle class="dmn-dot" cx="16.60" cy="10.80" r="1.6" fill="#e8590c" style="animation-delay:-2.16s"/></g><g class="dmn-petals"><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#e8590c" transform="rotate(0 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#ff8a3d" transform="rotate(60 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#e8590c" transform="rotate(120 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#ff8a3d" transform="rotate(180 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#e8590c" transform="rotate(240 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#ff8a3d" transform="rotate(300 32 32)"/></g><circle cx="32" cy="32" r="3.4" fill="#2f4f73"/></g>
<text x="76" y="41" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#c2410c" letter-spacing="1.5">DMN<tspan font-weight="400" fill="#e8590c" dx="8">SOFT</tspan></text>
</svg>
