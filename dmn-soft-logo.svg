<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 254 68" width="254" height="68" role="img" aria-label="DMN SOFT">
<title>DMN SOFT</title>
<style>.dmn-orbit,.dmn-petals{transform-box:view-box;transform-origin:32px 32px}
.dmn-orbit{animation:dmn-orbit 18s linear infinite}
.dmn-petals{animation:dmn-bloom 9s ease-in-out infinite}
.dmn-dot{animation:dmn-pulse 2.4s ease-in-out infinite}
@keyframes dmn-orbit{to{transform:rotate(360deg)}}
@keyframes dmn-bloom{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.06) rotate(6deg)}}
@keyframes dmn-pulse{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dmn-orbit,.dmn-petals,.dmn-dot{animation:none}}</style>
<g><g class="dmn-orbit"><circle class="dmn-dot" cx="32.00" cy="4.00" r="2.3" fill="#e8590c" style="animation-delay:-0.00s"/><circle class="dmn-dot" cx="48.46" cy="9.35" r="1.6" fill="#e8590c" style="animation-delay:-0.24s"/><circle class="dmn-dot" cx="58.63" cy="23.35" r="2.3" fill="#e8590c" style="animation-delay:-0.48s"/><circle class="dmn-dot" cx="58.63" cy="40.65" r="1.6" fill="#e8590c" style="animation-delay:-0.72s"/><circle class="dmn-dot" cx="48.46" cy="54.65" r="2.3" fill="#e8590c" style="animation-delay:-0.96s"/><circle class="dmn-dot" cx="32.00" cy="60.00" r="1.6" fill="#e8590c" style="animation-delay:-1.20s"/><circle class="dmn-dot" cx="15.54" cy="54.65" r="2.3" fill="#e8590c" style="animation-delay:-1.44s"/><circle class="dmn-dot" cx="5.37" cy="40.65" r="1.6" fill="#e8590c" style="animation-delay:-1.68s"/><circle class="dmn-dot" cx="5.37" cy="23.35" r="2.3" fill="#e8590c" style="animation-delay:-1.92s"/><circle class="dmn-dot" cx="15.54" cy="9.35" r="1.6" fill="#e8590c" style="animation-delay:-2.16s"/></g><g class="dmn-petals"><ellipse cx="32" cy="19.4" rx="5.8" ry="11.6" fill="#e8590c" transform="rotate(0 32 32)"/><ellipse cx="32" cy="19.4" rx="5.8" ry="11.6" fill="#ff8a3d" transform="rotate(60 32 32)"/><ellipse cx="32" cy="19.4" rx="5.8" ry="11.6" fill="#e8590c" transform="rotate(120 32 32)"/><ellipse cx="32" cy="19.4" rx="5.8" ry="11.6" fill="#ff8a3d" transform="rotate(180 32 32)"/><ellipse cx="32" cy="19.4" rx="5.8" ry="11.6" fill="#e8590c" transform="rotate(240 32 32)"/><ellipse cx="32" cy="19.4" rx="5.8" ry="11.6" fill="#ff8a3d" transform="rotate(300 32 32)"/></g><circle cx="32" cy="32" r="11.6" fill="#2f4f73" stroke="#ffffff" stroke-width="1.4"/><text x="32" y="35.2" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8.6" font-weight="700" fill="#ffffff" letter-spacing=".2">DMN</text></g>
<text x="76" y="41" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#c2410c" letter-spacing="1.5">DMN<tspan font-weight="400" fill="#e8590c" dx="8">SOFT</tspan></text>
</svg>
