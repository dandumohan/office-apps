<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office applications – SF Division, Chittoor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --ink:#32363a; --muted:#6a6d70; --nav:#2f4f73; --nav-soft:#4a74a4; --icon:#7a9fca; --link:#0a6ed1;
  --tile:#ffffff; --tile-hover:#f1f4f8; --line:rgba(47,79,115,.28); --focus:#000;
  --bar:#b9cee5; --shell-h:48px; --hdr:96px;
  --font:"72","72full",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:400 14px/1.4 var(--font);
  background:linear-gradient(180deg,#b1c8e0 0,#c9d9ea 40%,#dfe7f0 100%) fixed}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px dotted var(--focus);outline-offset:2px}

/* header stays on screen while the page scrolls */
header{position:sticky;top:0;z-index:20;background:var(--bar);box-shadow:0 1px 0 rgba(47,79,115,.12)}
.shell{display:flex;align-items:center;gap:1.25rem;height:var(--shell-h);padding:0 30px}
.brand{font-weight:700;font-size:15px;color:var(--nav);line-height:1.15;max-width:11rem}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--nav-soft)}
.homebtn{display:flex;align-items:center;gap:.4rem;font-weight:700;font-size:16px;color:var(--nav-soft);padding:.35rem .25rem}
.homebtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:4px;color:var(--nav)}
.iconbtn:hover{background:rgba(255,255,255,.45)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


/* DMN SOFT logo */
.logo{display:flex;align-items:center;gap:.65rem;flex:none;color:#8c2f00;text-decoration:none;border-radius:4px}
.dmn-mark{width:46px;height:46px;flex:none;overflow:visible}
.logo-text{font:700 18px/1 var(--font);letter-spacing:.05em}
.logo-text span{margin-left:.35em;font-weight:400;color:#9a3412}
.sep{flex:none;width:1px;height:30px;background:var(--line)}
.dmn-orbit,.dmn-petals{transform-box:view-box;transform-origin:32px 32px}
.dmn-orbit{animation:dmn-orbit 18s linear infinite}
.dmn-petals{animation:dmn-bloom 9s ease-in-out infinite}
.dmn-dot{animation:dmn-pulse 2.4s ease-in-out infinite}
@keyframes dmn-orbit{to{transform:rotate(360deg)}}
@keyframes dmn-bloom{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.06) rotate(6deg)}}
@keyframes dmn-pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* search: icon opens a wide box with its own search button */
.searchbox{display:none;align-items:stretch}
.searchbox input{width:min(33rem,52vw);font:italic 14px var(--font);color:var(--ink);background:#fff;border:1px solid #6b7f95;border-right:0;border-radius:3px 0 0 3px;padding:.4rem .6rem;height:30px}
.searchbox input:not(:placeholder-shown){font-style:normal}
.searchbox .go{display:grid;place-items:center;width:32px;height:30px;background:#fff;border:1px solid #6b7f95;border-radius:0 3px 3px 0;color:var(--nav)}
.searchbox .go svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
body.searching .searchbox{display:flex}
body.searching #searchOpen{display:none}

/* tabs = sections of the page */
.tabs{display:flex;gap:2rem;margin:0 26px;padding:0 4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:.7rem 0 .6rem;font-size:16px;color:var(--nav);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#16314f}
.tab[aria-current=true]{border-bottom-color:#0a6ed1;font-weight:700}

/* page */
main{padding:6px 50px 30vh}
.sec{scroll-margin-top:calc(var(--hdr) + 8px);padding-top:22px}
.sec-title{margin:0 0 12px 16px;font:400 18px/1.3 var(--font);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,176px);gap:8px}
.tile{position:relative;display:flex;flex-direction:column;width:176px;height:176px;padding:14px 16px;background:var(--tile);border-radius:4px;color:var(--ink);text-decoration:none;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.12)}
.tile:hover{background:var(--tile-hover)}
.tile:focus-visible{outline:2px dotted var(--focus);outline-offset:-5px}
.t-title{font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t-sub{margin-top:6px;font-size:13px;color:var(--muted)}
.t-icon{margin-top:auto;color:var(--icon);line-height:0}
.t-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.t-last{position:absolute;right:14px;bottom:14px;font-size:12px;color:var(--muted)}
.empty{margin:1.5rem 16px;color:var(--nav);font-size:16px}
.note{margin:2rem 16px 0;color:var(--nav);font-size:13px}

/* grey veil behind the page while the search box is open */
#dim{position:fixed;left:0;right:0;bottom:0;top:var(--shell-h);z-index:30;background:rgba(72,82,96,.3)}
#dim[hidden]{display:none}

/* Home: "All applications" panel */
.allapps{position:fixed;z-index:40;left:4px;top:calc(var(--shell-h) - 4px);width:min(896px,calc(100vw - 8px));max-height:calc(100vh - var(--shell-h) - 16px);display:flex;flex-direction:column;background:#fff;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.28)}
.allapps[hidden]{display:none}
.allapps::before{content:"";position:absolute;top:-7px;left:var(--caret,170px);width:14px;height:14px;background:#fff;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(0,0,0,.08)}
.aa-title{position:relative;padding:.8rem 1rem;text-align:center;color:var(--muted);font-size:14px;border-bottom:1px solid #e0e0e0}
.aa-body{display:grid;grid-template-columns:320px 1fr;min-height:0;height:min(450px,70vh)}
.aa-left{list-style:none;margin:0;padding:0;overflow:auto;border-right:1px solid #d9d9d9}
.aa-left li+li{border-top:1px solid #e5e5e5}
.aa-left button{display:block;width:100%;text-align:left;padding:.55rem 1rem;font-size:14px;line-height:1.5;color:var(--ink)}
.aa-left button:hover{background:#f3f6fa}
.aa-left button[aria-current=true]{background:#e4ecf7}
.aa-right{display:flex;flex-direction:column;min-height:0;overflow:auto}
.aa-head{padding:.55rem 1rem;background:#f5f5f5;border-bottom:1px solid #e5e5e5;color:#515559;font-size:14px}
.aa-links{list-style:none;margin:0;padding:.35rem 0}
.aa-links a{display:block;padding:.5rem 1rem;color:var(--link);text-decoration:none;font-size:14px}
.aa-links a:hover{background:#f3f6fa;text-decoration:underline}

@media (max-width:40rem){
  :root{--shell-h:48px}
  .shell{padding:0 14px;gap:.75rem}
  .brand,.sep{display:none}
  .logo-text{font-size:15px}
  .dmn-mark{width:38px;height:38px}
  .tabs{margin:0 12px;gap:1.4rem}
  main{padding:4px 12px 30vh}
  .sec-title{margin-left:4px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tile{width:auto;height:160px}
  .searchbox input{width:calc(100vw - 150px)}
  .aa-body{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:min(480px,72vh)}
  .aa-left{max-height:14rem;border-right:0;border-bottom:1px solid #d9d9d9}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.dmn-orbit,.dmn-petals,.dmn-dot{animation:none}}
</style>
</head>
<body>
<h1 class="sr-only">Office applications, SF Division, Chittoor</h1>

<header id="hdr">
  <div class="shell" id="shell">
    <a class="logo" href="./" aria-label="DMN SOFT"><svg class="dmn-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g class="dmn-orbit"><circle class="dmn-dot" cx="32.00" cy="5.80" r="2.3" fill="#e8590c" style="animation-delay:-0.00s"/><circle class="dmn-dot" cx="47.40" cy="10.80" r="1.6" fill="#e8590c" style="animation-delay:-0.24s"/><circle class="dmn-dot" cx="56.92" cy="23.90" r="2.3" fill="#e8590c" style="animation-delay:-0.48s"/><circle class="dmn-dot" cx="56.92" cy="40.10" r="1.6" fill="#e8590c" style="animation-delay:-0.72s"/><circle class="dmn-dot" cx="47.40" cy="53.20" r="2.3" fill="#e8590c" style="animation-delay:-0.96s"/><circle class="dmn-dot" cx="32.00" cy="58.20" r="1.6" fill="#e8590c" style="animation-delay:-1.20s"/><circle class="dmn-dot" cx="16.60" cy="53.20" r="2.3" fill="#e8590c" style="animation-delay:-1.44s"/><circle class="dmn-dot" cx="7.08" cy="40.10" r="1.6" fill="#e8590c" style="animation-delay:-1.68s"/><circle class="dmn-dot" cx="7.08" cy="23.90" r="2.3" fill="#e8590c" style="animation-delay:-1.92s"/><circle class="dmn-dot" cx="16.60" cy="10.80" r="1.6" fill="#e8590c" style="animation-delay:-2.16s"/></g><g class="dmn-petals"><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#e8590c" transform="rotate(0 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#ff8a3d" transform="rotate(60 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#e8590c" transform="rotate(120 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#ff8a3d" transform="rotate(180 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#e8590c" transform="rotate(240 32 32)"/><ellipse cx="32" cy="20.8" rx="5.2" ry="9.2" fill="#ff8a3d" transform="rotate(300 32 32)"/></g><circle cx="32" cy="32" r="3.4" fill="#2f4f73"/></svg><span class="logo-text">DMN<span>SOFT</span></span></a>
    <span class="sep" aria-hidden="true"></span>
    <div class="brand">Office applications<small>SF Division, Chittoor</small></div>
    <button id="homeBtn" class="homebtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="allApps">Home
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></button>
    <div class="spacer"></div>
    <form class="searchbox" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search In: Apps" aria-label="Search in applications" autocomplete="off">
      <button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
    </form>
    <button id="searchOpen" class="iconbtn" type="button" aria-label="Search applications">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>

<div id="allApps" class="allapps" role="dialog" aria-label="All applications" hidden>
  <div class="aa-title">All applications</div>
  <div class="aa-body">
    <ul class="aa-left" id="aaLeft"></ul>
    <div class="aa-right"><div class="aa-head" id="aaHead"></div><ul class="aa-links" id="aaLinks"></ul></div>
  </div>
</div>
<div id="dim" hidden></div>

<main id="page"></main>

<script>
/* To add an application: copy its file to the repository and add one line below. */
const ICONS={
  tokens:'<circle cx="12" cy="12" r="9"/><path d="M8.5 8h7M8.5 11h7M10 8a3 3 0 0 1 0 6H8.5l5.5 4"/>',
  fsr:'<rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="3.5" rx=".5"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/>',
  dms:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  proceedings:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  plantation:'<path d="M12 3l5 7h-3l4 7H6l4-7H7z"/><path d="M12 17v4"/>',
  nursery:'<path d="M12 21v-8"/><path d="M12 13c0-4-3-6-7-6 0 4 3 6 7 6z"/><path d="M12 15c0-3 2-5 6-5 0 3-2 5-6 5z"/>',
  reports:'<path d="M4 20h16M7 20v-7M12 20V6M17 20v-10"/>',
  kanban:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>'
};
const GROUPS=[
  {title:'Accounts and estimates', apps:[
    {id:'tokens', name:'Token dashboard', sub:'Tokens, budget, vouchers', path:'Mtokenboard.html', desc:'Tokens, budget, APOs, estimates, vouchers, Mbook, withdrawals, nursery, personnel, vehicle and procurement in one place.'},
    {id:'fsr', name:'FSR estimate entry', sub:'Estimates from FSR items', path:'Mestimate.html', desc:'Prepare estimates from FSR items, with task rates and amounts. Sign in with your token dashboard email and password.'}
  ]},
  {title:'Records and proceedings', apps:[
    {id:'dms', name:'Document management', sub:'Files and letters', path:'Mfile.html', desc:'File numbers, letters and addresses.'},
    {id:'proceedings', name:'Proceedings builder', sub:'Draft proceedings', path:'Mproceedings.html', desc:'Draft proceedings for SF Division, Chittoor.'}
  ]},
  {title:'Field and nursery', apps:[
    {id:'plantation', name:'Plantation tracker', sub:'Plantation records', path:'Mplantation.html', desc:'Plantation records.'},
    {id:'nursery', name:'Seedling portal', sub:'Nursery stock and enquiries', path:'Mnursery.html', desc:'Nursery enquiries, stock and transactions.'}
  ]},
  {title:'Reports and tasks', apps:[
    {id:'reports', name:'Mreports', sub:'Accounts reports (PDF)', path:'Macc_rpt.html', desc:'Generate accounts reports as PDF.'},
    {id:'kanban', name:'Kanban board', sub:'Task board', path:'Mkanban.html', desc:'Track tasks on a board.'}
  ]}
];
const ALL=GROUPS.flatMap(g=>g.apps);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let last=''; try{ last=localStorage.getItem('officeLauncherLast')||''; }catch(e){}
const remember=id=>{ try{ localStorage.setItem('officeLauncherLast',id); }catch(e){} };
const find=id=>ALL.find(a=>a.id===id);
function openApp(id){ const a=find(id); if(!a) return; remember(id); location.href=a.path; }
document.addEventListener('click',e=>{ const a=e.target.closest('a[data-id]'); if(a) remember(a.dataset.id); });
const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- page: one section per group; the tabs jump to them ---- */
function tile(a){
  return '<a class="tile" href="'+a.path+'" data-id="'+a.id+'" title="'+esc(a.desc)+'">'+
    '<span class="t-title">'+esc(a.name)+'</span><span class="t-sub">'+esc(a.sub)+'</span>'+
    '<span class="t-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+ICONS[a.id]+'</svg></span>'+
    (a.id===last?'<span class="t-last">Last opened</span>':'')+'</a>';
}
const NOTE='<p class="note">Each application asks you to sign in when it opens.</p>';
function showSections(){
  $('page').innerHTML=GROUPS.map((g,i)=>'<section class="sec" id="sec'+i+'" aria-labelledby="h'+i+'"><h2 class="sec-title" id="h'+i+'">'+esc(g.title)+'</h2><div class="tiles">'+g.apps.map(tile).join('')+'</div></section>').join('')+NOTE;
}
$('tabs').innerHTML=GROUPS.map((g,i)=>'<button class="tab" type="button" data-i="'+i+'">'+esc(g.title)+'</button>').join('');
let active=0, lock=0;
function setActive(i){ active=i; document.querySelectorAll('.tab').forEach((b,k)=>{ if(k===i) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); }); const t=document.querySelector('.tab[aria-current]'); if(t&&t.scrollIntoView&&!searching()) t.scrollIntoView({block:'nearest',inline:'nearest'}); }
function measure(){ document.documentElement.style.setProperty('--hdr',$('hdr').offsetHeight+'px'); document.documentElement.style.setProperty('--shell-h',$('shell').offsetHeight+'px'); }
function spy(){
  if(searching()||Date.now()<lock) return;
  const y=$('hdr').offsetHeight+30; let cur=0;
  GROUPS.forEach((_,i)=>{ const el=$('sec'+i); if(el&&el.getBoundingClientRect().top<=y) cur=i; });
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2) cur=GROUPS.length-1;
  if(cur!==active) setActive(cur);
}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return; const i=Number(b.dataset.i);
  if(searching()) closeSearch();
  setActive(i); lock=Date.now()+700;
  const el=$('sec'+i); if(el) el.scrollIntoView({behavior:reduce()?'auto':'smooth',block:'start'});
});
window.addEventListener('scroll',spy,{passive:true});
window.addEventListener('resize',()=>{ measure(); spy(); });

/* ---- search ---- */
const searching=()=>document.body.classList.contains('searching');
function openSearch(){ closeAll(); document.body.classList.add('searching'); $('dim').hidden=false; measure(); $('q').focus(); }
function closeSearch(){ document.body.classList.remove('searching'); $('dim').hidden=true; $('q').value=''; showSections(); setActive(active); }
function results(){
  const q=$('q').value.trim().toLowerCase();
  $('dim').hidden=!!q;                       /* the grey veil only shows while the box is empty */
  if(!q){ showSections(); return []; }
  const list=ALL.filter(a=>(a.name+' '+a.sub+' '+a.desc+' '+a.path).toLowerCase().includes(q));
  $('page').innerHTML='<section class="sec"><h2 class="sec-title">Search results</h2>'+
    (list.length?'<div class="tiles">'+list.map(tile).join('')+'</div>':'<p class="empty" role="status">No application matches “'+esc($('q').value.trim())+'”. Clear the search to see all applications.</p>')+'</section>';
  return list;
}
$('searchOpen').onclick=openSearch;
$('q').oninput=results;
$('dim').onclick=closeSearch;
$('searchForm').onsubmit=e=>{ e.preventDefault(); const l=results(); if(l.length===1) openApp(l[0].id); else if(l.length){ const t=document.querySelector('#page .tile'); if(t) t.focus(); } };

/* ---- Home: All applications panel ---- */
let sel='all';
function fillPanel(){
  const items=[{key:'all',title:'Home page apps',apps:ALL}].concat(GROUPS.map((g,i)=>({key:'g'+i,title:g.title,apps:g.apps})));
  $('aaLeft').innerHTML=items.map(it=>'<li><button type="button" data-k="'+it.key+'"'+(it.key===sel?' aria-current="true"':'')+'>'+esc(it.title)+'</button></li>').join('');
  const cur=items.find(it=>it.key===sel)||items[0];
  $('aaHead').textContent=cur.title;
  $('aaLinks').innerHTML=cur.apps.map(a=>'<li><a href="'+a.path+'" data-id="'+a.id+'" title="'+esc(a.desc)+'">'+esc(a.name)+'</a></li>').join('');
}
function openPanel(){
  closeSearchQuiet(); fillPanel(); $('allApps').hidden=false; $('homeBtn').setAttribute('aria-expanded','true'); measure();
  const r=$('homeBtn').getBoundingClientRect(), p=$('allApps').getBoundingClientRect();
  $('allApps').style.setProperty('--caret',Math.max(12,r.left+r.width/2-p.left-7)+'px');
  const c=document.querySelector('#aaLeft [aria-current]'); if(c) c.focus();
}
function closePanel(){ $('allApps').hidden=true; $('homeBtn').setAttribute('aria-expanded','false'); }
function closeSearchQuiet(){ if(searching()) closeSearch(); }
function closeAll(){ closePanel(); }
$('homeBtn').onclick=e=>{ e.stopPropagation(); if($('allApps').hidden) openPanel(); else closePanel(); };
$('aaLeft').addEventListener('click',e=>{ const b=e.target.closest('button[data-k]'); if(!b) return; e.stopPropagation(); sel=b.dataset.k; fillPanel(); const c=document.querySelector('#aaLeft [aria-current]'); if(c) c.focus(); });
document.addEventListener('click',e=>{ if(!$('allApps').hidden&&!e.target.closest('#allApps')&&!e.target.closest('#homeBtn')) closePanel(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!$('allApps').hidden){ closePanel(); $('homeBtn').focus(); }
  else if(searching()){ closeSearch(); $('searchOpen').focus(); }
});

showSections(); measure(); setActive(0); spy();
/* direct link: index.html?app=kanban opens that application straight away */
const want=new URLSearchParams(location.search).get('app');
if(want&&find(want)) openApp(want);
</script>
<noscript>
<main><h2>Applications</h2><ul>
<li><a href="Mtokenboard.html">Token dashboard</a></li>
<li><a href="Mestimate.html">FSR estimate entry</a></li>
<li><a href="Mfile.html">Document management</a></li>
<li><a href="Mproceedings.html">Proceedings builder</a></li>
<li><a href="Mplantation.html">Plantation tracker</a></li>
<li><a href="Mnursery.html">Seedling portal</a></li>
<li><a href="Macc_rpt.html">Mreports</a></li>
<li><a href="Mkanban.html">Kanban board</a></li></ul></main>
</noscript>
</body>
</html>
