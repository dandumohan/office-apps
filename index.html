<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office applications – SF Division, Chittoor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#eef2ef; --surface:#ffffff; --ink:#16261f; --muted:#56655e; --line:#cfdad3;
  --accent:#1f5c45; --accent-ink:#ffffff; --tint:#e3eee8; --focus:#0b6bcb;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--font)}
main{max-width:52rem;margin:0 auto;padding:2.5rem 1.25rem 3rem}
h1{font-size:2rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{margin:.35rem 0 0;color:var(--muted);font-size:1.0625rem}

.quick{margin:2rem 0 1.75rem;padding:1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.quick label{display:block;font-weight:700;margin-bottom:.5rem}
.quick .row{display:flex;gap:.625rem;flex-wrap:wrap}
select,input[type=search]{font:inherit;color:var(--ink);background:#fff;border:1px solid #8fa399;border-radius:4px;padding:.6rem .75rem;min-height:2.75rem}
select{flex:1 1 16rem;min-width:0}
button{font:inherit;font-weight:700;color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:.6rem 1.5rem;min-height:2.75rem;cursor:pointer}
button:hover{background:#174a38}
button:disabled{background:#8fa399;border-color:#8fa399;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.filter{display:flex;align-items:center;gap:.75rem;margin:0 0 .5rem;flex-wrap:wrap}
.filter input{flex:1 1 14rem}
.count{color:var(--muted);font-size:.9375rem}

section{margin-top:1.75rem}
h2{font-size:1.125rem;margin:0 0 .25rem;padding-bottom:.5rem;border-bottom:2px solid var(--accent);font-weight:700}
.apps{list-style:none;margin:0;padding:0}
.apps li{border-bottom:1px solid var(--line)}
.apps a{display:grid;grid-template-columns:1fr auto;gap:.25rem 1.5rem;align-items:baseline;padding:.9rem .5rem;color:inherit;text-decoration:none}
.apps a:hover{background:var(--tint)}
.name{font-weight:700;font-size:1.0625rem;color:var(--accent)}
.apps a:hover .name{text-decoration:underline;text-underline-offset:3px}
.desc{grid-column:1;color:var(--ink);max-width:40rem}
.path{grid-column:2;grid-row:1;color:var(--muted);font-size:.875rem;white-space:nowrap}
.last{grid-column:2;grid-row:2;justify-self:end;font-size:.875rem;font-weight:700;color:var(--accent)}
.empty{margin:2rem 0;color:var(--muted)}
footer{margin-top:2.5rem;color:var(--muted);font-size:.9375rem}
@media (max-width:34rem){
  h1{font-size:1.625rem}
  .apps a{grid-template-columns:1fr}
  .path,.last{grid-column:1;grid-row:auto;justify-self:start}
}
</style>
</head>
<body>
<main>
  <h1>Office applications</h1>
  <p class="sub">SF Division, Chittoor</p>

  <div class="quick">
    <label for="pick">Choose an application</label>
    <div class="row">
      <select id="pick" aria-describedby="hint"></select>
      <button id="go" type="button" disabled>Open</button>
    </div>
    <p id="hint" class="count" style="margin:.5rem 0 0">The application opens in this tab. Use your browser’s back button to return here.</p>
  </div>

  <div class="filter">
    <input id="q" type="search" placeholder="Filter by name or purpose" aria-label="Filter applications">
    <span class="count" id="count" role="status"></span>
  </div>

  <div id="list"></div>
  <p class="empty" id="none" hidden>No application matches that filter. Clear the filter to see them all.</p>

  <footer>Each application asks you to sign in when it opens.</footer>
</main>

<script>
/* To add an application: copy the files to the repository and add one line here. */
const GROUPS=[
  {title:'Accounts and estimates', apps:[
    {id:'tokens', name:'Token dashboard', path:'Mtokenboard.html', desc:'Tokens, budget, APOs, estimates, vouchers, Mbook, withdrawals, nursery, personnel, vehicle and procurement in one place.'},
    {id:'fsr', name:'FSR estimate entry', path:'Mestimate.html', desc:'Prepare estimates from FSR items, with task rates and amounts. Sign in with your token dashboard email and password.'}
  ]},
  {title:'Records and proceedings', apps:[
    {id:'dms', name:'Document management', path:'Mfile.html', desc:'File numbers, letters and addresses.'},
    {id:'proceedings', name:'Proceedings builder', path:'Mproceedings.html', desc:'Draft proceedings for SF Division, Chittoor.'}
  ]},
  {title:'Field and nursery', apps:[
    {id:'plantation', name:'Plantation tracker', path:'Mplantation.html', desc:'Plantation records.'},
    {id:'nursery', name:'Seedling portal', path:'Mnursery.html', desc:'Nursery enquiries, stock and transactions.'}
  ]},
  {title:'Reports and tasks', apps:[
    {id:'reports', name:'Mreports', path:'Macc_rpt.html', desc:'Generate accounts reports as PDF.'},
    {id:'kanban', name:'Kanban board', path:'Mkanban.html', desc:'Track tasks on a board.'}
  ]}
];
const ALL=GROUPS.flatMap(g=>g.apps);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let last=''; try{ last=localStorage.getItem('officeLauncherLast')||''; }catch(e){}
const remember=id=>{ try{ localStorage.setItem('officeLauncherLast',id); }catch(e){} };
const find=id=>ALL.find(a=>a.id===id);

function openApp(id){ const a=find(id); if(!a) return; remember(id); location.href=a.path; }

/* drop-down */
$('pick').innerHTML='<option value="">Select an application…</option>'+GROUPS.map(g=>'<optgroup label="'+esc(g.title)+'">'+g.apps.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</optgroup>').join('');
if(find(last)) $('pick').value=last;
const sync=()=>{ $('go').disabled=!$('pick').value; };
sync();
$('pick').onchange=sync;
$('go').onclick=()=>openApp($('pick').value);

/* list with filter */
function render(){
  const q=$('q').value.trim().toLowerCase(); let n=0;
  $('list').innerHTML=GROUPS.map(g=>{
    const rows=g.apps.filter(a=>!q||(a.name+' '+a.desc+' '+a.path).toLowerCase().includes(q));
    n+=rows.length; if(!rows.length) return '';
    return '<section><h2>'+esc(g.title)+'</h2><ul class="apps">'+rows.map(a=>
      '<li><a href="'+a.path+'" data-id="'+a.id+'"><span class="name">'+esc(a.name)+'</span><span class="path">'+esc(a.path)+'</span>'+
      '<span class="desc">'+esc(a.desc)+'</span>'+(a.id===last?'<span class="last">Last opened</span>':'')+'</a></li>').join('')+'</ul></section>';
  }).join('');
  $('none').hidden=n>0; $('count').textContent=n+' of '+ALL.length+' shown';
}
$('q').oninput=render;
$('list').addEventListener('click',e=>{ const a=e.target.closest('a[data-id]'); if(a) remember(a.dataset.id); });
render();

/* direct link: index.html?app=kanban opens that application straight away */
const want=new URLSearchParams(location.search).get('app');
if(want&&find(want)) openApp(want);
</script>
<noscript>
<main><h2>Applications</h2><ul>
<li><a href="Mtokenboard.html">Token dashboard</a></li>
<li><a href="Mestimate.html">FSR estimate entry</a></li>
<li><a href="Mfile.html">Document management</a></li>
<li><a href="Mproceedings.html">Proceedings builder</a></li>
<li><a href="Mplantation.html">Plantation tracker</a></li>
<li><a href="Mnursery.html">Seedling portal</a></li>
<li><a href="Macc_rpt.html">Mreports</a></li>
<li><a href="Mkanban.html">Kanban board</a></li></ul></main>
</noscript>
</body>
</html>
