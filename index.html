<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office applications – SF Division, Chittoor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root{
  --forest:#123d33;      /* header band */
  --moss:#1f6b53;        /* links, buttons */
  --moss-dark:#175240;
  --gold:#c39a3a;        /* single thin accent rule */
  --paper:#f3f6f4;       /* page */
  --surface:#ffffff;
  --ink:#14221d;
  --muted:#53655e;
  --line:#d3dcd7;
  --tint:#e6f0eb;
  --focus:#0b63c4;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.5 var(--sans)}

/* header */
.masthead{position:relative;overflow:hidden;background:var(--forest);color:#fff;border-bottom:4px solid var(--gold)}
.contours{position:absolute;inset:0;width:100%;height:100%;color:rgba(255,255,255,.11);pointer-events:none}
.masthead .in{position:relative;max-width:60rem;margin:0 auto;padding:3rem 1.5rem 5.25rem}
.masthead h1{margin:0;font:700 2.5rem/1.1 var(--serif);letter-spacing:-.01em}
.masthead p{margin:.6rem 0 0;font-size:1.1875rem;color:#cfe3da}

main{max-width:60rem;margin:0 auto;padding:0 1.5rem 3rem}

/* quick open panel overlaps the header */
.quick{position:relative;margin-top:-2.75rem;padding:1.25rem 1.5rem 1.35rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(18,61,51,.12)}
.quick label{display:block;font-weight:700;margin-bottom:.5rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
select,input[type=search]{font:inherit;color:var(--ink);background:#fff;border:1px solid #8ea299;border-radius:6px;padding:.65rem .8rem;min-height:2.875rem}
select{flex:1 1 18rem;min-width:0}
button{font:inherit;font-weight:700;color:#fff;background:var(--moss);border:1px solid var(--moss);border-radius:6px;padding:.65rem 1.75rem;min-height:2.875rem;cursor:pointer;transition:background-color .15s}
button:hover{background:var(--moss-dark)}
button:disabled{background:#94a79e;border-color:#94a79e;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hint{margin:.6rem 0 0;color:var(--muted);font-size:.9375rem}

/* filter */
.filter{display:flex;align-items:center;gap:1rem;margin:2rem 0 .25rem;flex-wrap:wrap}
.filter input{flex:1 1 16rem}
.count{color:var(--muted);font-size:.9375rem}

/* groups */
section{margin-top:2rem}
h2{margin:0 0 .75rem;font:700 1.375rem/1.2 var(--serif);color:var(--forest)}
.apps{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.apps li+li{border-top:1px solid var(--line)}
.apps a{display:grid;grid-template-columns:auto 1fr auto;gap:.25rem 1.1rem;align-items:center;padding:1rem 1.25rem;color:inherit;text-decoration:none;transition:background-color .15s}
.apps a:hover{background:var(--tint)}
.icon{grid-row:1/3;display:grid;place-items:center;width:3rem;height:3rem;border-radius:8px;background:var(--tint);color:var(--moss)}
.apps a:hover .icon{background:#fff}
.icon svg{width:1.6rem;height:1.6rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.name{font-weight:700;font-size:1.125rem;line-height:1.25}
.desc{grid-column:2;color:var(--muted);max-width:42rem}
.act{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:.35rem}
.open{display:inline-block;padding:.45rem 1.1rem;border:1.5px solid var(--moss);border-radius:6px;color:var(--moss);font-weight:700;font-size:.9375rem;background:#fff;transition:background-color .15s,color .15s}
.apps a:hover .open{background:var(--moss);color:#fff}
.last{font-size:.8125rem;font-weight:700;color:#7a5a12;background:#f7edd2;border-radius:999px;padding:.1rem .6rem}
.empty{margin:2rem 0;color:var(--muted)}
footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9375rem}

@media (max-width:40rem){
  .masthead .in{padding:2.25rem 1.25rem 4.5rem}
  .masthead h1{font-size:1.9rem}
  main{padding:0 1rem 2.5rem}
  .apps a{grid-template-columns:auto 1fr;padding:.9rem 1rem}
  .desc{grid-row:2}
  .act{grid-column:2;grid-row:3;flex-direction:row;align-items:center;justify-content:space-between;margin-top:.5rem}
  .icon{grid-row:1/4;align-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

.6 L552,225.3 L576,227.5 L600,229.7 L624,231.0 L648,231.1 L672,229.4 L696,225.9 L720,220.8 L744,214.4 L768,207.4 L792,200.6 L816,194.6 L840,190.1 L864,187.7 L888,187.4 L912,189.3 L936,192.9 L960,197.7 L984,202.9 L1008,208.0 L1032,212.1 L1056,214.9 L1080,216.2 L1104,216.0 L1128,214.7 L1152,212.8 L1176,210.9 L1200,209.7"/></g></svg>
  <div class="in">
    <h1>Office applications</h1>
    <p>SF Division, Chittoor</p>
  </div>
</header>

<main>
  <div class="quick">
    <label for="pick">Choose an application</label>
    <div class="row">
      <select id="pick" aria-describedby="hint"></select>
      <button id="go" type="button" disabled>Open</button>
    </div>
    <p id="hint" class="hint">The application opens in this tab. Use your browser’s back button to return here.</p>
  </div>

  <div class="filter">
    <input id="q" type="search" placeholder="Filter by name or purpose" aria-label="Filter applications">
    <span class="count" id="count" role="status"></span>
  </div>

  <div id="list"></div>
  <p class="empty" id="none" hidden>No application matches that filter. Clear the filter to see them all.</p>

  <footer>Each application asks you to sign in when it opens.</footer>
</main>

<script>
/* To add an application: copy its file to the repository and add one line below. */
const ICONS={
  tokens:'<circle cx="12" cy="12" r="9"/><path d="M8.5 8h7M8.5 11h7M10 8a3 3 0 0 1 0 6H8.5l5.5 4"/>',
  fsr:'<rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="3.5" rx=".5"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/>',
  dms:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  proceedings:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  plantation:'<path d="M12 3l5 7h-3l4 7H6l4-7H7z"/><path d="M12 17v4"/>',
  nursery:'<path d="M12 21v-8"/><path d="M12 13c0-4-3-6-7-6 0 4 3 6 7 6z"/><path d="M12 15c0-3 2-5 6-5 0 3-2 5-6 5z"/>',
  reports:'<path d="M4 20h16M7 20v-7M12 20V6M17 20v-10"/>',
  kanban:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>'
};
const GROUPS=[
  {title:'Accounts and estimates', apps:[
    {id:'tokens', name:'Token dashboard', path:'Mtokenboard.html', desc:'Tokens, budget, APOs, estimates, vouchers, Mbook, withdrawals, nursery, personnel, vehicle and procurement in one place.'},
    {id:'fsr', name:'FSR estimate entry', path:'Mestimate.html', desc:'Prepare estimates from FSR items, with task rates and amounts. Sign in with your token dashboard email and password.'}
  ]},
  {title:'Records and proceedings', apps:[
    {id:'dms', name:'Document management', path:'Mfile.html', desc:'File numbers, letters and addresses.'},
    {id:'proceedings', name:'Proceedings builder', path:'Mproceedings.html', desc:'Draft proceedings for SF Division, Chittoor.'}
  ]},
  {title:'Field and nursery', apps:[
    {id:'plantation', name:'Plantation tracker', path:'Mplantation.html', desc:'Plantation records.'},
    {id:'nursery', name:'Seedling portal', path:'Mnursery.html', desc:'Nursery enquiries, stock and transactions.'}
  ]},
  {title:'Reports and tasks', apps:[
    {id:'reports', name:'Mreports', path:'Macc_rpt.html', desc:'Generate accounts reports as PDF.'},
    {id:'kanban', name:'Kanban board', path:'Mkanban.html', desc:'Track tasks on a board.'}
  ]}
];
const ALL=GROUPS.flatMap(g=>g.apps);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let last=''; try{ last=localStorage.getItem('officeLauncherLast')||''; }catch(e){}
const remember=id=>{ try{ localStorage.setItem('officeLauncherLast',id); }catch(e){} };
const find=id=>ALL.find(a=>a.id===id);
function openApp(id){ const a=find(id); if(!a) return; remember(id); location.href=a.path; }

/* drop-down */
$('pick').innerHTML='<option value="">Select an application…</option>'+GROUPS.map(g=>'<optgroup label="'+esc(g.title)+'">'+g.apps.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</optgroup>').join('');
if(find(last)) $('pick').value=last;
const sync=()=>{ $('go').disabled=!$('pick').value; };
sync();
$('pick').onchange=sync;
$('go').onclick=()=>openApp($('pick').value);

/* list with filter */
function render(){
  const q=$('q').value.trim().toLowerCase(); let n=0;
  $('list').innerHTML=GROUPS.map(g=>{
    const rows=g.apps.filter(a=>!q||(a.name+' '+a.desc+' '+a.path).toLowerCase().includes(q));
    n+=rows.length; if(!rows.length) return '';
    return '<section><h2>'+esc(g.title)+'</h2><ul class="apps">'+rows.map(a=>
      '<li><a href="'+a.path+'" data-id="'+a.id+'"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+ICONS[a.id]+'</svg></span>'+
      '<span class="name">'+esc(a.name)+'</span>'+
      '<span class="act">'+(a.id===last?'<span class="last">Last opened</span>':'')+'<span class="open">Open</span></span>'+
      '<span class="desc">'+esc(a.desc)+'</span></a></li>').join('')+'</ul></section>';
  }).join('');
  $('none').hidden=n>0; $('count').textContent=n+' of '+ALL.length+' shown';
}
$('q').oninput=render;
$('list').addEventListener('click',e=>{ const a=e.target.closest('a[data-id]'); if(a) remember(a.dataset.id); });
render();

/* direct link: index.html?app=kanban opens that application straight away */
const want=new URLSearchParams(location.search).get('app');
if(want&&find(want)) openApp(want);
</script>
